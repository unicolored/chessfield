<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chessfield Demo</title>

    <style>
      body {
        display: flex;
        flex-wrap: wrap;
      }

      body > div {
        margin: 10px;
      }

      .chessfield {
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        border-radius: 10px;
        /*width: 800px;*/
        height: 740px;
        aspect-ratio: 1;
        border: 1px solid white;
      }
    </style>

    <script type="module">
      import chessJs from 'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm';
      import { Chessfield } from './dist/chessfield.js';

      const board1 = new Chessfield(document.getElementById('board-1'), {
        orientation: 'white',
        camera: 'white',
        angle: 'right',
        theme: 'green',
      });

      // board1.setShape(0, 0, '#0000ff');

      // board1.setShape(7, 7, '#ff0000');

      // Clear specific square
      // board1.clearShape(3, 4);

      // Clear all
      // board1.clearShape();

      const fen = 'rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq e3 0 1';
      board1.setFen(fen, ['e2', 'e4']);

      chess.getCastlingRights(BLACK); // black can castle queenside only
      // -> { 'k': false, 'q': true }

      chess.setHeader('White', 'Morphy'); // Retrieve the PGN headers.
      chess.setHeader('Black', 'Anderssen');
      chess.setHeader('Date', '1858-??-??');

      try {
        // import { validateFen } from 'chess.js'
        // validateFen('2n1r3/p1k2pp1/B1p3b1/P7/5bP1/2N1B3/1P2KP2/2R5 b - - 4 25')
        // -> { ok: true }

        // .load(fen: string, { skipValidation = false, preserveHeaders = false } = {})
        chess.load('8/4p3/8/8/8/8/4P3/6K1 w - - 1 45', { skipValidation: true });
      } catch (e) {
        console.error(e);
      }

      chess.moveNumber();
      chess.turn(); // Returns the current side to move.

      chess.inCheck(); // Returns true or false if the side to move is in check.

      chess.isCheckmate(); // Returns true or false if the side to move has been checkmated.
      chess.isDraw(); // Returns true or false if the game is drawn (50-move rule or insufficient material).
      chess.isStalemate(); // Returns true or false if the side to move has been stalemated.

      chess.isGameOver(); // Returns true if the game has ended via checkmate, stalemate, draw, threefold repetition, or insufficient material. Otherwise, returns false.

      // Returns a list of legal moves from the current position.
      // .moves({ piece?: Piece, square?: Square, verbose = false} = {})
    </script>
  </head>
  <body>
    <div>
      basic board, default config
      <div class="chessfield" id="board-1"></div>
    </div>

    <script>
      // Connect to esbuild's live reload event stream
      new EventSource('/esbuild').addEventListener('change', () => location.reload());
    </script>
  </body>
</html>
