<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chessfield Demo</title>

    <link rel="stylesheet" href="demo.css" />

    <script type="module"></script>
  </head>
  <body>
    <nav class="demo-nav">
      <a href="../index.html">Main Demo</a>
      <a href="demo.html">Basic Demo</a>
      <a href="state.html" class="current">State Demo</a>
      <a href="animated.html">Animated Demo</a>
    </nav>
    <div style="display: flex; flex-wrap: wrap">
      <div>
        default
        <div class="chessfield" id="board-default"></div>
      </div>
      <div>
        check
        <div class="chessfield" id="board-check"></div>
      </div>
      <div>
        mate
        <div class="chessfield" id="board-mate"></div>
      </div>
      <div>
        draw
        <div class="chessfield" id="board-draw"></div>
      </div>
      <div>
        black resigned
        <div class="chessfield" id="board-resign"></div>
      </div>
      <div>
        lost on time
        <div class="chessfield" id="board-timeout"></div>
      </div>
    </div>
